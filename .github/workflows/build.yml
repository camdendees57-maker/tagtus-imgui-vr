name: build-arm64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ndk
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: deps
        run: |
          git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby.git third_party/Dobby

      - name: build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ls -lh build/libtagtusimgui.so

      - uses: actions/upload-artifact@v4
        with:
          name: libtagtusimgui
          path: build/libtagtusimgui.so
          if-no-files-found: error
